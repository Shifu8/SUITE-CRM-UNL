[php]
; ============================================================
;  SuiteCRM UNL – Configuración PHP optimizada
; ============================================================

; Memoria y tiempo de ejecución
memory_limit = 512M
max_execution_time = 300
max_input_time = 300
max_input_vars = 10000

; Subida de archivos
upload_max_filesize = 64M
post_max_size = 64M

; Zona horaria
date.timezone = America/Guayaquil

; Encoding
default_charset = UTF-8

; Sesiones
session.gc_maxlifetime = 7200
session.cookie_httponly = 1

; OPcache (mejora rendimiento)
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 60
opcache.fast_shutdown = 1

; Errores (ocultar en producción)
display_errors = Off
log_errors = On
error_log = /var/www/html/logs/php_error.log
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Extensiones necesarias para SuiteCRM
extension=pdo_mysql
extension=mysqli
extension=gd
extension=zip
extension=mbstring
extension=curl
extension=intl
extension=soap
extension=ldap
