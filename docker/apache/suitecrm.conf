<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/public

    # Logs
    ErrorLog ${APACHE_LOG_DIR}/suitecrm_error.log
    CustomLog ${APACHE_LOG_DIR}/suitecrm_access.log combined

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # Soporte para URLs amigables (SuiteCRM SPA + Legacy)
        <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /

            # SuiteCRM 8 Angular Frontend: pasar al index.html si no existe el archivo
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteCond %{REQUEST_URI} !^/legacy
            RewriteRule ^(.*)$ index.php [QSA,L]
        </IfModule>
    </Directory>

    # Directorio legacy (SuiteCRM PHP clásico)
    <Directory /var/www/html/public/legacy>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Seguridad: bloquear acceso a archivos sensibles
    <FilesMatch "\.(env|sql|log|sh|md|lock|json)$">
        Require all denied
    </FilesMatch>

    # Cabeceras de seguridad
    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options nosniff
        Header always set X-Frame-Options SAMEORIGIN
        Header always set X-XSS-Protection "1; mode=block"
    </IfModule>

    # Compresión GZIP
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css application/javascript application/json
    </IfModule>

    # Cache para assets estáticos
    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresByType image/jpeg "access plus 1 month"
        ExpiresByType image/png "access plus 1 month"
        ExpiresByType text/css "access plus 1 week"
        ExpiresByType application/javascript "access plus 1 week"
    </IfModule>
</VirtualHost>
